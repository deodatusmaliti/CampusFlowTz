name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static site
        run: |
          npm run build
          # Ensure .nojekyll exists in dist
          touch dist/.nojekyll
          # Ensure 404.html fallback exists in dist
          if [ -f public/404.html ]; then
            cp public/404.html dist/404.html
          else
            cp dist/index.html dist/404.html
          fi
        env:
          BASE_PATH: ./

      # Method 1: Deploy to gh-pages branch (for "Deploy from a branch" -> gh-pages -> / (root))
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ''

      # Method 2: Upload Pages artifact for native GitHub Actions Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-native-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
